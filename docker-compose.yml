services:
  postgres:
    image: postgres:17-alpine
    container_name: qr-pay-postgres
    environment:
      POSTGRES_USER: qrpay
      POSTGRES_PASSWORD: qrpay
      POSTGRES_DB: qrpay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrpay -d qrpay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
